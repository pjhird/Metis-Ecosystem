[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-ecosystem"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
metis = "metis.cli:main"

[tool.setuptools.packages.find]
include = ["metis*"]

[tool.setuptools.package-data]
"metis.data_access" = ["migrations/*.sql"]
