{
  "name": "Metis tests",
  "on": {
    "pull_request": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "tests": {
      "name": "metis/tests",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Run test suite",
          "run": "python -m unittest discover -s tests -v"
        }
      ]
    }
  }
}
